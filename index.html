<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASIV - Mobile Asset Surveying, Information and Verification System</title>
    <meta name="description" content="MASIV - Survey Made Easy : Mudah, Cepat, Akurat. Aplikasi Survey Distribusi & Dashboard GIS Pemetaan PLN." />
  </head>

  <body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: Inter, system-ui, sans-serif;">
    <div id="root">
      <!-- Instant Startup Splash Screen (Identical to MASIV Mobile App) -->
      <div style="position: fixed; inset: 0; background-color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999;">
        <img src="/splashs.png" alt="MASIV PLN" style="width: 220px; height: 220px; object-fit: contain;" />
        <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; text-align: center;">
          <div style="width: 22px; height: 22px; border: 3px solid #E3F2FD; border-top: 3px solid #0D47A1; border-radius: 50%; animation: masiv-spin 0.8s linear infinite;"></div>
          <div style="font-size: 13px; font-weight: 700; color: #0D47A1; margin-top: 14px; letter-spacing: 0.2px;">
            Survey Made Easy : Mudah, Cepat, Akurat
          </div>
          <div style="font-size: 11px; font-weight: 700; color: #9E9E9E; letter-spacing: 2px; margin-top: 4px;">
            PLN OPTADIS GIS SYSTEM
          </div>
        </div>
      </div>
      <style>
        @keyframes masiv-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
